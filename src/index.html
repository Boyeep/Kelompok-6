<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <h1>📋 My To Do List</h1>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Mau ngapain hari ini?"
        autocomplete="off"
      />
      <button type="submit">Tambah</button>
    </form>

    <div class="filters" id="filters" role="group" aria-label="Filter task">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">Semua</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Aktif</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Selesai</button>
    </div>

    <ul id="task-list" class="task-list">
      <!-- Task dirender otomatis oleh js/app.js, jangan ditulis manual di sini -->
    </ul>

    <!--
      TODO (Fitur #5 - Counter & Fitur #6 - Clear Completed):
      Tambahkan info jumlah task tersisa dan tombol untuk menghapus
      semua task yang sudah selesai. Lihat README.md nomor 5 dan 6.

      Contoh struktur:
      <div class="footer" id="footer">
        <span id="task-counter">0 task tersisa</span>
        <button id="clear-completed">Hapus yang Selesai</button>
      </div>
    -->
  </main>

  <script src="js/app.js"></script>
</body>
</html>
