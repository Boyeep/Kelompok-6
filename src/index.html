<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <main class="app">
    <h1>
      <i class="fa-solid fa-clipboard-list"></i> My To Do List
    </h1>
    <button id="theme-toggle" class="theme-toggle">
      <i class="fa-solid fa-moon"></i>
    </button>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Mau ngapain hari ini?"
        autocomplete="off"
      />
      <button type="submit">
        <i class="fa-solid fa-plus"></i>
      </button>
    </form>

    <div class="filters" id="filters" role="group" aria-label="Filter task">
      <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">Semua</button>
      <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Aktif</button>
      <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Selesai</button>
    </div>

    <ul id="task-list" class="task-list">
      <!-- Task dirender otomatis oleh js/app.js, jangan ditulis manual di sini -->
    </ul>

    <div class="footer" id="footer">
      <span id="task-counter">0 task tersisa</span>
      <button type="button" id="clear-completed">Hapus yang Selesai</button>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
